name: Build and Deploy Static Web App (manual Node)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci
        working-directory: ./    # adjust if app is in subfolder

      - name: Build
        run: npm run build
        working-directory: ./    # adjust if app is in subfolder

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: ./dist           # adjust if Vite outputs elsewhere

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-dist

      # Deploy using the Azure Static Web Apps action but skip its internal build
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"                    # set to repo root or subfolder
          api_location: ""                     # keep empty if backend is separate
          app_artifact_location: "dist"        # the already-built artifact
          skip_app_build: true
