name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v3

      # --- FIX 1: Use Node 20 (your project requires Node 20.19+) ---
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # Install & build manually (NOT by Oryx)
      - name: Install dependencies
        run: npm ci

      - name: Build Vite App
        run: npm run build

      # --- Deploy built artifact ---
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_HILL_0F237F010 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"

          # Where your source code is
          app_location: "/"

          # Your built folder (Vite = dist)
          app_artifact_location: "dist"

          # IMPORTANT: prevent Oryx build (Node 18 problem)
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_HILL_0F237F010 }}
          action: "close"
